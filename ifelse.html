<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>if else</title>
</head>
<body>
    <script type="text/javascript">
    let age=20;
    if(age>=18){
        document.write("<b>You are an adult.</b>");
    }
    else{
        document.write("<b>You are a minor.</b>");
    }
    </script>
</body>
</html>
