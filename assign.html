<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment operator</title>
    <script type="text/javascript">
        var a=40;
        var b=20;
        var linebreak = "<br>";

        document.write("value of a => (a=b)=>");
        result = (a=b);
        document.write(result);
        document.write(linebreak);

        document.write("value of a => (a+=b)=>");
        result = (a+=b);
        document.write(result);
        document.write(linebreak);

        document.write("value of a => (a-=b)=>");
        result = (a-=b);
        document.write(result);
        document.write(linebreak);

        document.write("value of a => (a*=b)=>");
        result = (a*=b);
        document.write(result);
        document.write(linebreak);

        document.write("value of a => (a/=b)=>");
        result = (a/=b);
        document.write(result);
        document.write(linebreak);

        document.write("value of a => (a%=b)=>");
        result = (a%=b);
        document.write(result);
        document.write(linebreak);
    </script>
</head>
<body>
    <p>can set the variables to different values</p>
</body>
</html>
